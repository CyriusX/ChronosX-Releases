# Production Nginx — serves frontend + proxies API on the same domain
# chronosx.cyriusx.com

upstream api_backend {
    server api:8080;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
}

server {
    listen 80;
    server_name chronosx.cyriusx.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name chronosx.cyriusx.com;

    # SSL certificates (configure with Certbot)
    ssl_certificate /etc/letsencrypt/live/chronosx.cyriusx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronosx.cyriusx.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Client body size
    client_max_body_size 2M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Logging
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # Health check endpoint (proxied directly to API)
    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    # Hangfire dashboard (proxied to API)
    location /hangfire {
        proxy_pass http://api_backend/hangfire;
    }

    # Scalar API documentation
    location /scalar/ {
        proxy_pass http://api_backend/scalar/;
    }

    # API endpoints — proxy to .NET backend
    location /api/ {
        proxy_pass http://api_backend;
    }

    # Everything else — serve the web frontend
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
    }
}
