# Nginx configuration for TimeTrack API
# Place this file at /etc/nginx/conf.d/api.yourdomain.com

upstream timetrack_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name api.yourdomain.com;

    # SSL certificates (configure with Certbot)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone burst_limit zone=burst limit_req=50r/m;
    limit_conn zone=burst limit_conn=5;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Client body size
    client_max_body_size 2M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Logging
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    location / {
        # Health check endpoint (no authentication required)
        location /health {
            proxy_pass http://timetrack_api/health;
            access_log off;
        }

        # Hangfire dashboard (requires authentication - handle separately)
        location /hangfire {
            proxy_pass http://timetrack_api/hangfire;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://timetrack_api;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scalar API documentation (optional - disable in production if not needed)
        location /scalar/ {
            proxy_pass http://timetrack_api/scalar;
        }
    }
}
