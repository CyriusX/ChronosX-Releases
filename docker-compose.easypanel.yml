# Docker Compose for EasyPanel deployment (dev environment)
# Connects to the existing production database: chronosx_prod-chronos-db
#
# Prerequisites:
# - The chronosx_prod-chronos-db container must be running on the same Docker host
# - Both containers must share a network (EasyPanel default or explicit external network)

services:
  # .NET API Backend
  api:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    container_name: timetrack-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=chronosx_prod-chronos-db;Port=5432;Database=chronosx;Username=postgres;Password=2ffc8a164abfaf63657e;SSL Mode=Disable
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET required}
      - Jwt__Issuer=${JWT_ISSUER:-TimeTrack}
      - Jwt__Audience=${JWT_AUDIENCE:-TimeTrack.Api}
      - Jwt__AccessTokenExpiryMinutes=${JWT_ACCESS_TOKEN_EXPI_MINUTES:-60}
      - Jwt__RefreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPI_DAYS:-90}
      - Resend__ApiKey=${RESEND_API_KEY:-}
      - Email__From=${EMAIL_FROM:-noreply@yourdomain.com}
      - Email__FromName=${EMAIL_FROM_NAME:-TimeTrack}
      - Frontend__BaseUrl=${FRONTEND_URL:-https://chronosx-dev-timetrack-web.gpoda0.easypanel.host}
      - Database__MigrateOnStartup=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - easypanel

  # React Web Frontend
  web:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-https://chronosx-dev-timetrack-api.gpoda0.easypanel.host/api/v1}
    container_name: timetrack-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - easypanel

networks:
  easypanel:
    external: true
    name: easypanel
