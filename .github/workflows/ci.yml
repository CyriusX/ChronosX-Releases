name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TimeTrack.sln

      - name: Build
        run: dotnet build TimeTrack.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TimeTrack.sln --configuration Release --no-build --verbosity normal

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/ui/timetrack-ui/package-lock.json

      - name: Setup Inno Setup
        run: choco install innosetup -y

      - name: Install UI dependencies
        working-directory: src/ui/timetrack-ui
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Installer
        run: |
          .\installer\scripts\build-installer.ps1 -Configuration Release -Version "${{ steps.get_version.outputs.VERSION }}"
        shell: powershell

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosX-Installer
          path: build/installer/ChronosX-Setup-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/installer/ChronosX-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
