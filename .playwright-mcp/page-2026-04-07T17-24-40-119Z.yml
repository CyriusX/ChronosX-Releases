              - paragraph [ref=e380]: "Issue Identified:"
              - paragraph [ref=e381]: The internal Docker health check at localhost:8080/health is passing (otherwise Docker would restart the container). However, the external health check via EasyPanel's proxy returns 500.
              - paragraph [ref=e382]: "This indicates the issue is NOT with the health check logic itself, but possibly with:"
              - list [ref=e383]:
                - listitem [ref=e384]: EasyPanel's reverse proxy configuration - Something in the proxy layer is causing issues
                - listitem [ref=e385]: The Npgsql health check - The database health check might be throwing an exception that's not being caught
                - listitem [ref=e386]: Request headers/host - The health check might be sensitive to the Host header
              - paragraph [ref=e387]: "Recommended Next Steps:"
              - list [ref=e388]:
                - listitem [ref=e389]: Check the application logs for exceptions when the health endpoint is called
                - listitem [ref=e390]: Simplify the health check - Remove the Npgsql dependency temporarily to see if it's the database check causing the issue
                - listitem [ref=e391]: Check EasyPanel's proxy configuration - There might be a timeout or header issue in the proxy layer
