# Development docker-compose
# For production, use docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local development backend
  # Use .env file for secrets (see .env.example)
  api:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    container_name: timetrack-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION:-Host=postgres;Database=timetrack;Username=postgres;Password=postgres}
      - Jwt__Secret=${JWT_SECRET:-dev-secret-min-32-characters-long-for-development}
      - Jwt__Issuer=TimeTrack
      - Jwt__Audience=TimeTrack.Api
      - Resend__ApiKey=${RESEND_API_KEY:-}
      - Frontend__BaseUrl=${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
